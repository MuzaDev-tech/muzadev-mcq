<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuzaDev | MCQ Challenge</title>
<style>
:root{color-scheme:dark;--bg:#050b22;--panel:#0b1538;--blue:#168cff;--purple:#7657ff;--gold:#ffd21c;--green:#39e879;--red:#ff6378}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(circle at 85% 18%,#123b88 0,transparent 28%),radial-gradient(circle at 10% 85%,#21105e 0,transparent 30%),var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:#f7f9ff}
.wrap{width:min(760px,100%);border:1px solid #4d62c9;border-radius:24px;padding:clamp(20px,5vw,42px);background:linear-gradient(145deg,rgba(14,28,72,.97),rgba(5,12,37,.98));box-shadow:0 22px 80px #0009,0 0 40px #286bff22}
.brand{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.logo{font-weight:900;font-size:clamp(24px,5vw,34px);letter-spacing:-1px}.logo span{color:#20a7ff}.tag{font-size:12px;color:#a9b8e8;letter-spacing:2px;text-transform:uppercase}
.challenge{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase}
h1{font-size:clamp(25px,5vw,38px);line-height:1.2;margin:12px 0 24px}
.highlight{color:var(--gold)}
.options{display:grid;gap:12px}
.option{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border:1px solid #5269cf;border-radius:15px;background:#0a1740;color:#fff;font-size:clamp(16px,3vw,20px);font-weight:650;cursor:pointer;transition:.18s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:#35b7ff;background:#10245c}
.letter{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:11px;background:#172b67;color:#8bd6ff;font-weight:900}
.option.correct{border:2px solid var(--green);background:#073c32}.option.correct .letter{background:#0b8c5b;color:white}
.option.wrong{border:2px solid var(--red);background:#451c35}.option.wrong .letter{background:#a83252;color:white}
.option:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:20px;padding:17px 18px;border-radius:14px;line-height:1.5;background:#101d43;border:1px solid #455ba9}
.feedback.show{display:block}.feedback.good{border-color:var(--green)}.feedback.bad{border-color:var(--red)}
.feedback strong{display:block;font-size:19px;margin-bottom:4px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
button.reset{border:0;border-radius:12px;background:linear-gradient(90deg,#168cff,#7657ff);color:white;padding:13px 20px;font-size:15px;font-weight:800;cursor:pointer}
.note{font-size:13px;color:#9fb0df}
footer{margin-top:30px;padding-top:20px;border-top:1px solid #26396f;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#a9b8e8;font-size:13px}
footer b{color:#fff}.pill{color:#a9d8ff;border:1px solid #246fbd;border-radius:99px;padding:7px 11px}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div><div class="logo">M<span>uza</span>Dev</div><div class="tag">Build • Learn • Innovate</div></div>
    <div class="challenge">✦ MCQ Challenge</div>
  </header>
  <div class="challenge">Blockchain / Solidity</div>
  <h1>Which programming language is primarily used to write <span class="highlight">Ethereum</span> smart contracts?</h1>
  <section class="options" id="options" aria-label="Answer options">
    <button class="option" data-answer="A"><span class="letter">A</span><span>Python</span></button>
    <button class="option" data-answer="B"><span class="letter">B</span><span>Solidity</span></button>
    <button class="option" data-answer="C"><span class="letter">C</span><span>Java</span></button>
    <button class="option" data-answer="D"><span class="letter">D</span><span>C++</span></button>
  </section>
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <div class="actions">
    <button class="reset" id="reset" type="button" hidden>Try again</button>
    <span class="note">Choose an option to reveal your result.</span>
  </div>
  <footer><span>💬 Pick your answer & challenge a friend</span><span class="pill">#Blockchain&nbsp; #Solidity&nbsp; #MuzaDev</span></footer>
</main>
<script>
const correct = "B";
const options = [...document.querySelectorAll(".option")];
const feedback = document.getElementById("feedback");
const reset = document.getElementById("reset");
options.forEach(button => button.addEventListener("click", () => {
  if (options.some(option => option.disabled)) return;
  const selected = button.dataset.answer;
  options.forEach(option => {
    option.disabled = true;
    if (option.dataset.answer === correct) option.classList.add("correct");
  });
  if (selected === correct) {
    feedback.className = "feedback show good";
    feedback.innerHTML = "<strong>🎉 Correct! Great job.</strong> Solidity is widely used to develop smart contracts on Ethereum.";
  } else {
    button.classList.add("wrong");
    feedback.className = "feedback show bad";
    feedback.innerHTML = "<strong>Not quite — keep learning!</strong> The correct answer is B. Solidity. It is widely used to develop smart contracts on Ethereum.";
  }
  reset.hidden = false;
}));
reset.addEventListener("click", () => {
  options.forEach(option => { option.disabled = false; option.classList.remove("correct","wrong"); });
  feedback.className = "feedback";
  feedback.textContent = "";
  reset.hidden = true;
});
</script>
</body>
</html>
